# Paste inside the existing `server { listen 443 ssl; server_name api.wimzai.com; ... }` block,
# above the generic `location /` that proxies to the relay on :8000.
# Requires /etc/nginx/snippets/wimz-mcp-proxy.conf (deploy/nginx-wimz-mcp-proxy.conf).

# --- WIM-Z MCP server + OAuth authorization server (127.0.0.1:8001) ---
location = /mcp        { proxy_pass http://127.0.0.1:8001; include /etc/nginx/snippets/wimz-mcp-proxy.conf; }
location /mcp/         { proxy_pass http://127.0.0.1:8001; include /etc/nginx/snippets/wimz-mcp-proxy.conf; }
location /authorize    { proxy_pass http://127.0.0.1:8001; include /etc/nginx/snippets/wimz-mcp-proxy.conf; }
location = /token      { proxy_pass http://127.0.0.1:8001; include /etc/nginx/snippets/wimz-mcp-proxy.conf; }
location = /register   { proxy_pass http://127.0.0.1:8001; include /etc/nginx/snippets/wimz-mcp-proxy.conf; }
location = /revoke     { proxy_pass http://127.0.0.1:8001; include /etc/nginx/snippets/wimz-mcp-proxy.conf; }
location /.well-known/oauth-authorization-server { proxy_pass http://127.0.0.1:8001; include /etc/nginx/snippets/wimz-mcp-proxy.conf; }
location /.well-known/oauth-protected-resource   { proxy_pass http://127.0.0.1:8001; include /etc/nginx/snippets/wimz-mcp-proxy.conf; }

# --- WIM-Z voice agent (127.0.0.1:8002) ---
location /agent/ {
    proxy_pass http://127.0.0.1:8002;
    include /etc/nginx/snippets/wimz-mcp-proxy.conf;
    client_max_body_size 6m;   # one WAV utterance
}
